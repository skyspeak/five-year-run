<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five Year Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a transit map. Each life is a line of five stations (years), read left to right.
   One centered column; the HUD is pinned at the top like a departure board. */
:root{
  --bg:#ECEFF4; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#101828; --muted:#5B6578; --rule:#D3D9E3;
  --board:#121A2B; --board-ink:#EEF2F8; --board-muted:#93A0B8; --board-track:#2A3550;
  --job:#2459E0; --gap:#DB8E00; --study:#8240E0; --go:#E2492F; --on-go:#FFFFFF;
  --good:#13865A; --bad:#C93A30; --good-bg:#DDF3E9; --bad-bg:#FBE3E0;
  --f-display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --f-body:'Instrument Sans','Helvetica Neue',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1019; --surface:#141C2C; --surface-2:#1A2337; --ink:#E8EDF5; --muted:#94A1B9; --rule:#2A3550;
    --board:#1B2539; --board-ink:#EEF2F8; --board-muted:#93A0B8; --board-track:#33405E;
    --job:#5B8CFF; --gap:#C4861F; --study:#9468F2; --go:#FF6A47; --on-go:#160B07;
    --good:#45C98F; --bad:#FF7468; --good-bg:#12352A; --bad-bg:#3E1C1B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1019; --surface:#141C2C; --surface-2:#1A2337; --ink:#E8EDF5; --muted:#94A1B9; --rule:#2A3550;
  --board:#1B2539; --board-ink:#EEF2F8; --board-muted:#93A0B8; --board-track:#33405E;
  --job:#5B8CFF; --gap:#C4861F; --study:#9468F2; --go:#FF6A47; --on-go:#160B07;
  --good:#45C98F; --bad:#FF7468; --good-bg:#12352A; --bad-bg:#3E1C1B; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-0.01em}
p{margin:0}
.kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
:focus-visible{outline:3px solid var(--go);outline-offset:2px;border-radius:6px}

/* brand */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-0.01em}
.bullet{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--go);color:var(--on-go);font-family:var(--f-display);font-weight:800;font-size:14px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--muted);font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:13px 20px;font-weight:600;font-size:16px;cursor:pointer;border:2px solid transparent;text-decoration:none;transition:transform .12s ease, background .12s ease}
.btn.go{background:var(--go);color:var(--on-go)}
.btn.go:hover{transform:translateY(-1px)}
.btn.go:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;border-color:var(--rule);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* hero */
.hero{display:flex;flex-direction:column;gap:16px;padding-top:20px}
.hero h1{font-size:clamp(40px,8vw,72px);font-weight:800;line-height:.98}
.hero h1 span{color:var(--go)}
.lede{font-size:18px;max-width:58ch;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.h-sm{font-size:20px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.steps div{display:flex;flex-direction:column;gap:4px}
.steps b{font-family:var(--f-mono);font-size:12px;color:var(--go)}
.steps strong{font-family:var(--f-display);font-size:17px}
.steps p{font-size:14px;color:var(--muted)}
@media (max-width:640px){.steps{grid-template-columns:1fr 1fr}}

/* route map */
.map{overflow-x:auto;margin-inline:-4px}
.map svg{display:block;min-width:600px;width:100%;height:auto}
.map .seg{stroke-width:10;stroke-linecap:round;fill:none}
.map .seg.job{stroke:var(--job)} .map .seg.gap{stroke:var(--gap)} .map .seg.study{stroke:var(--study)}
.map .stn{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.map .code{font-family:var(--f-mono);font-size:12px;font-weight:500;fill:var(--ink)}
.map .lbl{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.map .nm{font-family:var(--f-display);font-weight:700;font-size:14px;fill:var(--ink)}
.map .yr{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}

/* setup form */
.form{display:flex;flex-direction:column;gap:24px}
.field{display:flex;flex-direction:column;gap:10px}
.field > label,.field > .q{font-family:var(--f-display);font-weight:700;font-size:18px}
.field .hint{font-size:14px;color:var(--muted);margin-top:-6px}
.input{font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:2px solid var(--rule);background:var(--surface);color:var(--ink);max-width:320px;width:100%}
.input:focus{border-color:var(--ink);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--rule);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;transition:border-color .12s}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--board);color:var(--board-ink);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:14px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:900px){.hud{margin-inline:0;border-radius:14px;padding-inline:20px}}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hud-id{display:flex;align-items:center;gap:10px;min-width:0}
.hud-id .who{font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-id .where{font-family:var(--f-mono);font-size:12px;color:var(--board-muted)}
.years{display:flex;align-items:center;gap:0}
.years span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;border:2px solid var(--board-track);color:var(--board-muted);background:var(--board);position:relative}
.years span + span{margin-left:14px}
.years span + span::before{content:"";position:absolute;right:100%;top:50%;width:16px;height:3px;transform:translateY(-50%);background:var(--board-track)}
.years span.done{border-color:var(--board-ink);color:var(--board-ink)}
.years span.now{background:var(--go);border-color:var(--go);color:var(--on-go)}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 16px}
@media (max-width:640px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .k{display:flex;justify-content:space-between;font-size:12px;color:var(--board-muted)}
.stat .k b{font-family:var(--f-mono);font-weight:500;color:var(--board-ink)}
.bar{height:6px;border-radius:3px;background:var(--board-track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--board-ink);border-radius:3px;transition:width .5s ease}
.bar i.low{background:var(--go)}
.cash b{font-family:var(--f-mono);font-size:18px;font-weight:500;color:var(--board-ink)}
.cash b.neg{color:var(--go)}

/* cards & choices */
.stage{display:flex;flex-direction:column;gap:18px}
.stage h2{font-size:clamp(28px,5vw,40px);font-weight:800;line-height:1.05}
.event{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px;animation:rise .35s ease both}
.event .txt{font-size:18px;max-width:60ch}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.dot.job{background:var(--job)} .dot.gap{background:var(--gap)} .dot.study{background:var(--study)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface-2);border:2px solid var(--rule);border-radius:12px;padding:14px 16px;cursor:pointer;font-size:16px;transition:border-color .12s, transform .12s}
.choice:hover{border-color:var(--ink);transform:translateX(2px)}
.choice .ltr{font-family:var(--f-mono);font-size:13px;width:24px;height:24px;flex:none;border-radius:6px;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
.choice .odds{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:2px}
.outcome{display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--rule);padding-top:16px}
.outcome .you{font-size:14px;color:var(--muted)}
.outcome .res{font-size:18px;font-weight:500}
.rollnote{font-family:var(--f-mono);font-size:13px;padding:4px 10px;border-radius:6px;align-self:flex-start}
.rollnote.win{background:var(--good-bg);color:var(--good)} .rollnote.lose{background:var(--bad-bg);color:var(--bad)}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.d{font-family:var(--f-mono);font-size:13px;padding:3px 9px;border-radius:999px;animation:pop .4s ease both}
.d.up{background:var(--good-bg);color:var(--good)} .d.down{background:var(--bad-bg);color:var(--bad)}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}

/* option grids */
.group{display:flex;flex-direction:column;gap:12px}
.group h3{font-size:15px;font-family:var(--f-mono);font-weight:500;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.opt{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:2px solid var(--rule);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .12s, transform .12s;min-width:0}
.opt:hover:not(:disabled){border-color:var(--ink);transform:translateY(-2px)}
.opt:disabled{cursor:not-allowed;opacity:.5}
.opt .nm{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.15}
.opt .bl{font-size:14px;color:var(--muted)}
.opt .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.tag{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--rule)}
.tag.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt .code{font-family:var(--f-mono);font-size:28px;font-weight:500;line-height:1}
.notice{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:12px 14px;font-size:15px}
.notice.ok{background:var(--good-bg);color:var(--good)}

/* apply */
.apply{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:24px;display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center}
@media (max-width:640px){.apply{grid-template-columns:1fr}}
.dial{aspect-ratio:1;max-width:200px;width:100%;border-radius:50%;display:grid;place-items:center;text-align:center;background:conic-gradient(var(--good) calc(var(--p)*1%), var(--surface-2) 0);position:relative}
.dial::after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--surface)}
.dial div{position:relative;z-index:1;display:flex;flex-direction:column}
.dial b{font-family:var(--f-mono);font-size:44px;font-weight:500;line-height:1}
.dial small{font-size:12px;color:var(--muted)}
.dial.rolling b{color:var(--muted)}
.dial.win b{color:var(--good)} .dial.lose b{color:var(--bad)}
.breakdown{display:flex;flex-direction:column;gap:6px;font-size:14px}
.breakdown div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:5px}
.breakdown span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ledger */
.ledger{display:flex;flex-direction:column;gap:0;font-variant-numeric:tabular-nums}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.ledger div span:last-child{font-family:var(--f-mono)}
.ledger div.total{border-bottom:0;font-weight:600;font-size:18px}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* ending */
.verdict{display:flex;flex-direction:column;gap:10px}
.verdict h2{font-size:clamp(40px,8vw,64px);font-weight:800;line-height:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.vals{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:90px 1fr 28px;gap:10px;align-items:center;font-size:14px}
.vrow .bar{height:10px;background:var(--surface-2)}
.vrow .bar i{background:var(--muted)}
.vrow.top .bar i{background:var(--go)}
.vrow.top span:first-child{font-weight:600}
.vrow span:last-child{font-family:var(--f-mono);text-align:right;color:var(--muted)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ach div{border:1px solid var(--rule);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.ach div.got{background:var(--surface-2);border-color:var(--ink)}
.ach div:not(.got){opacity:.45}
.ach strong{font-family:var(--f-display);font-size:15px}
.ach span{font-size:13px;color:var(--muted)}
.tries{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.tries li{display:flex;flex-direction:column;gap:2px;padding-left:18px;border-left:3px solid var(--go)}
.tries strong{font-weight:600}
.tries span{color:var(--muted);font-size:15px}
.highlights{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.highlights{grid-template-columns:1fr}}
.highlights div{background:var(--surface-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.highlights strong{font-family:var(--f-display);font-size:17px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.num{font-family:var(--f-mono);text-align:right} th.num{text-align:right}
td.best{color:var(--good);font-weight:600}
.story-text{font-size:18px;line-height:1.65;max-width:62ch;white-space:pre-wrap}
/* simulations */
.simrun h2 .mono{font-weight:500}
.simtrack{height:14px;border-radius:7px;background:var(--surface);border:1px solid var(--rule);overflow:hidden}
.simtrack i{display:block;height:100%;background:linear-gradient(90deg,var(--job),var(--study),var(--gap));transition:width .1s linear}
.simpeek{font-size:13px;min-height:2.6em}
.found{font-size:clamp(34px,6.5vw,56px);font-weight:800;line-height:1.02}
.found span{color:var(--go)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.tiles{grid-template-columns:1fr 1fr}}
.tiles div{background:var(--board);color:var(--board-ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.tiles b{font-family:var(--f-mono);font-weight:500;font-size:clamp(26px,4.5vw,34px);line-height:1;font-variant-numeric:tabular-nums}
.tiles span{font-size:13px;color:var(--board-muted)}
.findings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.findings{grid-template-columns:1fr}}
.findings h3{font-size:18px;font-weight:700}
.findings p{font-size:15px;color:var(--muted)}
.scatter svg{min-width:560px}
.scatter .grid{stroke:var(--rule);stroke-width:1}
.scatter .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4}
.scatter .ax{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.scatter .pt{fill-opacity:.55;stroke:var(--surface);stroke-width:1}
.scatter .pt.job{fill:var(--job)} .scatter .pt.gap{fill:var(--gap)} .scatter .pt.study{fill:var(--study)}
.scatter .pt:hover{fill-opacity:1;stroke:var(--ink);stroke-width:2}
.ylab{font-size:11px;color:var(--muted);margin-bottom:-10px}
table.rank tr.lead td:first-child{font-weight:600}
.barcell{display:flex;align-items:center;gap:8px;min-width:150px}
.hbar{flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:0 4px 4px 0}
.hbar i.job{background:var(--job)} .hbar i.gap{background:var(--gap)} .hbar i.study{background:var(--study)} .hbar i.neutral{background:var(--muted)}
.stackbtns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.stackbtns .btn{font-size:15px;padding:10px 14px;text-align:left}
.vs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.vs{grid-template-columns:1fr 1fr}}
.vs div{display:flex;flex-direction:column;gap:2px}
.vs b{font-family:var(--f-mono);font-weight:500;font-size:26px}
.vs span{font-size:13px;color:var(--muted)}
.take{border:2px solid var(--go)}
.ainote{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ainote .linkbtn{font-size:12px;padding:0}
.modal{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:22px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.srcs{display:flex;flex-direction:column;gap:8px}
.srcopt{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface-2);border:2px solid var(--rule);border-radius:12px;padding:12px 14px;cursor:pointer}
.srcopt span{font-size:13px;color:var(--muted)}
.srcopt[aria-pressed="true"]{border-color:var(--ink)}
.aiform{display:flex;flex-direction:column;gap:6px}
.aiform label{font-size:13px;font-weight:600;margin-top:4px}
.aiform .input{max-width:none;font-size:15px;padding:10px 12px}
.aitest{font-size:12px;color:var(--muted)}
.aiform .hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.writing{display:flex;gap:8px;padding-block:6px}
.writing i{width:12px;height:12px;border-radius:50%;background:var(--go);animation:blink 1.2s ease-in-out infinite}

function fmtK(x){const a=Math.abs(x);const n=a>=10?Math.round(a):Math.round(a*10)/10;return (x<0?'−':'')+'$'+n+'k'}
function signed(x,k){return (x>0?'+':'')+(k==='cash'?fmtK(x).replace('$','$'):Math.round(x))}

function newLife(profile){
 const w=profile.stage==='working';
 return {screen:'path',mode:'open',profile,year:1,age:STAGES[profile.stage].age,
  stats:{cash:(w?10:3)-DEBTS[profile.debt].amt,skill:w?28:20,joy:55,energy:70,network:w?20:15,clarity:15},
  path:null,city:null,pending:null,history:[],revealed:Object.fromEntries(Object.keys(VALUES).map(k=>[k,0])),
  flags:{raise:0},seen:[],forcedYear:{},step:0,ev:null,outcome:null,rejected:[],kinds:[],cities:[],notes:[],saved:false,
  log:[],aiTitles:[],aiEv:null,aiBusy:false,aiErr:null,aiOff:false,aiNote:null};
}
function applyFx(fx){
 const s=state,d={};
 for(const [k,v] of Object.entries(fx||{})){
  if(!v)continue;
  if(k==='cash'){s.stats.cash+=v;d.cash=v}
  else{const b=s.stats[k];s.stats[k]=clamp(b+v,0,100);const r=s.stats[k]-b;if(r)d[k]=r}
 }
 return d;
}
function reveal(v,n=1){(v||[]).forEach(k=>state.revealed[k]+=n)}
function founderOpen(s){return !!s.flags.founderSpark||s.stats.skill>=50}
function roleOf(s,id,tenure){const p=PATHS[id];return (p.kind==='job'&&tenure>=2&&!['founder','temp'].includes(id)?'Senior ':'')+p.role}
function oddsFor(s,id,cityId){
 const p=PATHS[id],c=cityById(cityId),rows=[['Base odds',p.odds]];
 if(p.fit.includes(s.profile.field))rows.push(['Your degree fits',10]);
 const sk=Math.round((s.stats.skill-20)*0.6);if(sk)rows.push(['Skills',sk]);
 const nw=Math.round((s.stats.network-15)*0.35);if(nw)rows.push(['Network',nw]);
 if(p.kind==='job'&&s.flags.masters)rows.push(["Master's degree",12]);
 if(p.kind==='job'&&s.flags.offer)rows.push(['Internship offer',20]);
 if(p.kind==='study'&&s.history.some(h=>PATHS[h.id].kind!=='study'))rows.push(['Real-world experience',8]);
 if((id==='bigtech'||id==='startup')&&c.id==='SFO')rows.push(['Tech hub',5]);
 if((id==='finance'||id==='consult')&&(c.id==='NYC'||c.id==='LON'))rows.push(['Finance hub',5]);
 const total=clamp(rows.reduce((a,r)=>a+r[1],0),6,95);
 return {rows,total};
}
function needsRoll(s,id){const p=PATHS[id];if(s.path&&s.path.id===id)return false;return (p.kind==='job'&&p.odds<100)||p.kind==='study'}

/* ---------- flow ---------- */
function commit(){
 const s=state,{id,city}=s.pending,p=PATHS[id];s.notes=[];
 const prev=s.path;
 if(prev&&prev.id!==id){
  if(s.flags.handcuffs&&s.year<s.flags.handcuffs){s.stats.cash-=15;s.notes.push('You left early and paid back the $15k retention bonus.');s.flags.handcuffs=0}
  if(PATHS[prev.id].kind==='study'&&prev.yearsLeft>0){applyFx({joy:-3});s.notes.push("You dropped out of your master's. No degree, but no more tuition.")}
  s.flags.jobLost=false;
 }
 const same=prev&&prev.id===id;
 s.path={id,kind:p.kind,tenure:same?prev.tenure:0,yearsLeft:p.kind==='study'?(same?prev.yearsLeft:p.years):0};
 s.novel={kind:!s.kinds.includes(p.kind),city:!s.cities.includes(city)};
 if(s.novel.kind)s.kinds.push(p.kind);
 if(s.novel.city)s.cities.push(city);
 if(!same)reveal(p.v,2);
 if(s.city!==city)reveal(cityById(city).v,1);
 s.city=city;
 s.yearStart={...s.stats};
 s.history.push({year:s.year,id,kind:p.kind,city,role:roleOf(s,id,s.path.tenure)});
 s.rejected=[];s.step=0;s.pending=null;
 nextEvent();s.screen='event';
}
function nextEvent(){
 const s=state;
 s.outcome=null;s.aiEv=null;s.aiErr=null;
 const forced=FORCED.find(e=>e.when(s)&&s.forcedYear[e.id]!==s.year);
 if(forced){s.forcedYear[forced.id]=s.year;s.ev=forced.id;return}
 if(aiOn(s)){s.ev='ai';requestAiEvent();return}
 deckEvent();
}
function deckEvent(){
 const s=state;
 let ev;
 {
  const ok=e=>!s.seen.includes(e.id)&&(!e.when||e.when(s));
  const spec=SPEC.filter(ok),gen=GEN.filter(ok);
  const preferSpec=s.step===0?true:Math.random()<0.35;
  const pool=(preferSpec&&spec.length)?spec:(gen.length?gen:spec);
  ev=pool.length?rnd(pool):QUIET;
  s.seen.push(ev.id);
 }
 s.ev=ev.id;s.outcome=null;
}
function evById(id){return id==='ai'?state.aiEv:ALL_EVENTS.find(e=>e.id===id)}

/* POST an OpenAI-style chat request and read the streamed (SSE) or plain JSON reply. */
async function streamChat(url,headers,body,o){
 let res;
 try{res=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:o.signal})}
 catch(e){throw e?.name==='AbortError'?{code:'cancelled',message:'Stopped.'}:{code:'network',message:String(e?.message||e)}}
 if(!res.ok){
  let detail='';try{detail=(await res.text()).slice(0,300)}catch(e){}
  const s=res.status;
  throw {code:/not_configured/.test(detail)?'not_configured':s===401||s===403?'auth':s===404?'not_found':s===429?'rate_limited':s===400||s===422?'bad_request':'upstream_error',message:`HTTP ${s} ${detail}`};
 }
 if(!(res.headers.get('content-type')||'').includes('event-stream')){
  const j=await res.json().catch(()=>null),ch=j?.choices?.[0],t=ch?.message?.content||'';
  if(t)o.onText?.({text:t,delta:t});
  return {text:t,truncated:ch?.finish_reason==='length'};
 }
 const reader=res.body.getReader(),dec=new TextDecoder();
 let buf='',text='',truncated=false;
 try{
  for(;;){
   const {done,value}=await reader.read();if(done)break;
   buf+=dec.decode(value,{stream:true});
   let i;
   while((i=buf.indexOf('\n'))>=0){
    const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
    if(!line.startsWith('data:'))continue;
    const d=line.slice(5).trim();if(!d||d==='[DONE]')continue;
    let j;try{j=JSON.parse(d)}catch(e){continue}
    if(j.error)throw {code:'upstream_error',message:String(j.error.message||j.error)};
    const ch=j.choices?.[0],delta=ch?.delta?.content||'';
    if(ch?.finish_reason==='length')truncated=true;
    if(delta){text+=delta;o.onText?.({text,delta})}
   }
  }
 }catch(e){
  if(e?.name==='AbortError')throw {code:'cancelled',message:'Stopped.',text};
  throw e?.code?{...e,text}:{code:'upstream_error',message:String(e?.message||e),text};
 }
 return {text,truncated};
}
function parseLooseJson(t){
 try{return JSON.parse(t)}catch(e){}
 const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);
 if(f){try{return JSON.parse(f[1])}catch(e){}}
 const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
 if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
 return undefined;
}

}

 const stat=g=>({n:g.length,joy:avg(g.map(l=>l.f.joy)),cash:med(g.map(l=>l.f.cash)),clar:avg(g.map(l=>l.f.clarity)),energy:avg(g.map(l=>l.f.energy)),burn:pct(g,l=>l.burn),happy:pct(g,l=>l.f.joy>=70)});
 const group=key=>{const m={};L.forEach(l=>{(m[key(l)]=m[key(l)]||[]).push(l)});return Object.entries(m).map(([k,g])=>({k,...stat(g)}))};
 const all=stat(L);
 const byOpen=group(l=>l.open).filter(g=>g.n>=15).sort((a,b)=>b.joy-a.joy);
 const byCity=group(l=>l.openCity).filter(g=>g.n>=15).sort((a,b)=>b.joy-a.joy);
 const byKind=Object.fromEntries(group(l=>l.openKind).map(g=>[g.k,g]));
 const sorted=k=>L.map(l=>l.f[k]).sort((a,b)=>a-b);
 const dist={joy:sorted('joy'),cash:sorted('cash'),clarity:sorted('clarity'),energy:sorted('energy')};
 const rank=(k,v)=>{const d=dist[k];let i=0;while(i<d.length&&d[i]<v)i++;return i/d.length};
 const happiest=[...L].sort((a,b)=>b.f.joy-a.f.joy||b.f.cash-a.f.cash)[0];
 const richest=[...L].sort((a,b)=>b.f.cash-a.f.cash)[0];
 const balanced=[...L].sort((a,b)=>Math.min(...['joy','cash','clarity','energy'].map(k=>rank(k,b.f[k])))-Math.min(...['joy','cash','clarity','energy'].map(k=>rank(k,a.f[k]))))[0];
 const F=[],name=id=>PATHS[id].name,kname=k=>({job:'a job',gap:'a gap year',study:"a master's"})[k];
 const signedK=v=>(v>=0?'+':'−')+'$'+Math.abs(Math.round(v))+'k';
 const bestJoy=byOpen[0],bestCash=[...byOpen].sort((a,b)=>b.cash-a.cash)[0],worstBurn=[...byOpen].sort((a,b)=>b.burn-a.burn)[0];
 if(bestJoy)F.push({h:`Happiest first move: ${name(bestJoy.k)}`,p:`The ${bestJoy.n} lives that opened with ${name(bestJoy.k)} ended with average Joy ${Math.round(bestJoy.joy)}, the highest of any first move. ${bestJoy.happy}% of them ended happy (Joy 70+), against ${all.happy}% overall.`});
 if(bestCash)F.push({h:`Richest first move: ${name(bestCash.k)}`,p:bestCash.k===bestJoy?.k?`It also led on money: median savings of ${fmtK(bestCash.cash)} at age ${STAGES[profile.stage].age+4}. For you, money and happiness pointed the same way.`:`Median savings of ${fmtK(bestCash.cash)} at age ${STAGES[profile.stage].age+4}, against ${fmtK(all.cash)} overall. Average Joy was ${Math.round(bestCash.joy)}, ${Math.round(bestJoy.joy-bestCash.joy)} points below the happiest move.`});
 if(byKind.gap&&byKind.job){const dc=byKind.gap.clar-byKind.job.clar,dm=byKind.gap.cash-byKind.job.cash;F.push({h:`A gap year first: ${dc>=0?'+':''}${Math.round(dc)} Clarity, ${signedK(dm)}`,p:`Compared with starting in a job, lives that opened with a gap year ended ${Math.abs(Math.round(dc))} points ${dc>=0?'clearer':'less clear'} about what they want, with ${fmtK(Math.abs(dm))} ${dm>=0?'more':'less'} in median savings.`})}
 if(byKind.study&&byKind.job){const dm=byKind.study.cash-byKind.job.cash,dj=byKind.study.joy-byKind.job.joy;F.push({h:`A master's first: ${signedK(dm)} by age ${STAGES[profile.stage].age+4}`,p:`Tuition costs a lot up front. Lives that opened with a master's ended with ${fmtK(Math.abs(dm))} ${dm>=0?'more':'less'} in median savings than those that opened with a job, and average Joy ${dj>=0?'higher':'lower'} by ${Math.abs(Math.round(dj))}.`})}
 if(worstBurn&&worstBurn.burn>all.burn)F.push({h:`Burnout risk: ${name(worstBurn.k)}`,p:`${worstBurn.burn}% of lives that opened with ${name(worstBurn.k)} hit burnout at least once, against ${all.burn}% overall.`});
 const stayers=L.filter(l=>l.switches===0),movers=L.filter(l=>l.switches>=2);
 if(stayers.length>=20&&movers.length>=20){const dj=avg(movers.map(l=>l.f.joy))-avg(stayers.map(l=>l.f.joy)),dcl=avg(movers.map(l=>l.f.clarity))-avg(stayers.map(l=>l.f.clarity));F.push({h:(dj>=0)===(dcl>=0)?(dj>=0?'Changing course paid off':'Sticking with one thing paid off'):`Switching paths: ${dj>=0?'+':'−'}${Math.abs(Math.round(dj))} Joy, ${dcl>=0?'+':'−'}${Math.abs(Math.round(dcl))} Clarity`,p:`Lives that switched paths two or more times ended with ${Math.abs(Math.round(dj))} ${dj>=0?'more':'less'} Joy and ${Math.abs(Math.round(dcl))} ${dcl>=0?'more':'less'} Clarity than lives that never switched.`})}
 const top=[...L].sort((a,b)=>b.f.joy-a.f.joy).slice(0,Math.round(L.length/10));
 const share=k=>pct(top,l=>l.openKind===k),kinds=['job','gap','study'].sort((a,b)=>share(b)-share(a));
 const cityCount={};top.forEach(l=>cityCount[l.openCity]=(cityCount[l.openCity]||0)+1);
 const topCity=Object.entries(cityCount).sort((a,b)=>b[1]-a[1])[0];
 F.push({h:`What your happiest 10% had in common`,p:`${share(kinds[0])}% of your ${top.length} happiest lives started with ${kname(kinds[0])} (against ${pct(L,l=>l.openKind===kinds[0])}% of all lives). The most common first city among them was ${cityById(topCity[0]).name}.`});
 return {key:profileKey(profile),n:L.length,all,byOpen,byCity,byKind,dist,F,reps:[{label:'Happiest life',l:happiest},{label:'Richest life',l:richest},{label:'Most balanced',l:balanced}],
  pts:L.map(l=>({x:l.f.cash,y:l.f.joy,k:l.openKind,o:l.open,c:l.openCity}))};
}

 return `You are helping a young person who doesn't know what they want to do next. A life-simulator game, "Five Year Run", just ran 1,000 versions of their next five years. Read the results and tell them what to try first.

THE PERSON
${pr.name}, ${STAGES[pr.stage].label.toLowerCase()}, age ${STAGES[pr.stage].age}, studied ${FIELDS[pr.field]}, ${DEBTS[pr.debt].amt?'$'+DEBTS[pr.debt].amt+'k':'no'} student debt. Says they value most: ${pr.values.map(v=>VALUES[v]).join(' and ')}.

HOW THE SIMULATION WORKS
Each simulated life picked a random first move and city, then made choices leaning toward the values above. Outcomes are on 0-100 scales (Joy, Clarity, Energy) plus savings in dollars at age ${age}. It is a game model with made-up but plausible numbers, not a forecast.

OVERALL (1,000 lives)
${a.happy}% ended happy (Joy 70+). Median savings ${fmtK(a.cash).replace('−','-')}. ${a.burn}% burned out at least once. Average Clarity ${Math.round(a.clar)}.

FINDINGS
${sim.F.map(f=>`- ${f.h}: ${f.p}`).join('\n')}

FIRST MOVES, ranked by average Joy
${moves}

FIRST CITIES, ranked by average Joy
${cities}

STANDOUT LIVES
${reps}

WRITE
- 120 to 180 words, plain language, talking to ${pr.name} as "you". Short paragraphs, no headings, no bullet lists, no markdown.

  for(let i=ln.stops.length;i<5;i++)g+=`<line x1="${xs[i]-60}" y1="${y}" x2="${xs[i]+60}" y2="${y}" stroke="var(--rule)" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>`;

   const x=xs[i],moved=i>0&&ln.stops[i-1].city!==st.city;
   g+=moved?`<rect class="stn" x="${x-13}" y="${y-9}" width="26" height="18" rx="9"/>`:`<circle class="stn" cx="${x}" cy="${y}" r="8"/>`;
   g+=`<text class="code" x="${x}" y="${y-17}" text-anchor="middle">${st.city}</text>`;
   const lbl=PATHS[st.id].name;g+=`<text class="lbl" x="${x}" y="${y+27}" text-anchor="middle">${esc(lbl.length>17?lbl.slice(0,16)+'…':lbl)}</text>`;
  });
 });
 return `<div class="map">${g}</svg></div>`;
}

function vMultiverse(lives){

 const happiest=lives.reduce((a,b)=>b.final.joy>a.final.joy?b:a),idx=lives.indexOf(happiest)+1;
 const clear=state.confirmClear?`<div class="confirm"><span>Delete all saved lives from this browser?</span><button class="btn ghost" data-act="clearLives">Delete</button><button class="linkbtn" data-act="cancelClear">Keep them</button></div>`:`<button class="linkbtn" data-act="askClear" style="align-self:flex-start">Clear saved lives</button>`;
 return `<section class="panel" id="lives"><h3 class="h-sm">Your multiverse</h3><p class="muted">Every life you finish is saved in this browser. ${lives.length>1?`Your happiest so far is Life ${idx}, as ${esc(happiest.arch.replace('The ','the '))}. Green marks the best of each column.`:'Play another to compare.'}</p>
 ${routeSVG(lives.map((l,i)=>({name:`Life ${i+1}`,sub:l.arch,stops:l.stops})))}
 <div class="table-wrap"><table><thead><tr><th>Life</th><th>Route</th><th class="num">Savings</th><th class="num">Joy</th><th class="num">Energy</th><th class="num">Skills</th><th class="num">Clarity</th></tr></thead><tbody>${rows}</tbody></table></div>${clear}</section>`;
}

function vSimming(){
 const s=state;
 return `<header class="top"><div class="brand"><span class="bullet">5Y</span>Five Year Run</div></header>
 <section class="stage simrun"><p class="kicker">Simulating ${esc(s.profile.name)}</p><h2>Running your next five years <span class="mono" id="simcount">${s.done.toLocaleString()}</span> of 1,000 times</h2>
  <div class="simtrack" role="progressbar" aria-label="Simulations run" aria-valuemin="0" aria-valuemax="1000"><i id="simbar" style="width:${s.done/10}%"></i></div>
  <p class="mono muted simpeek" id="simpeek">${s.peek?esc(peekLine(s.peek,s.done)):'Setting up the board…'}</p>
  <p class="muted">Each version of you picks a first move and a city at random, then makes choices the way you said you would. Same events, same odds, same money math as the game.</p></section>`;
}
function scatterSVG(sim){
 const W=680,H=330,ml=40,mr=14,mt=14,mb=42,pts=sim.pts;
 const xs=pts.map(p=>p.x).sort((a,b)=>a-b);
 let lo=xs[Math.floor(xs.length*0.01)],hi=xs[Math.ceil(xs.length*0.99)-1];
 const span=Math.max(10,hi-lo),step=[10,20,25,50,100,200].find(s=>span/s<=6)||200;
 lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi===lo)hi=lo+step;
 const X=v=>ml+(clamp(v,lo,hi)-lo)/(hi-lo)*(W-ml-mr),Y=v=>mt+(100-v)/100*(H-mt-mb);
 let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scatter plot of ${pts.length} simulated lives: savings against Joy, colored by first move">`;
 for(const v of [0,25,50,75,100])g+=`<line class="grid" x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${ml-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
 for(let v=lo;v<=hi;v+=step)g+=`<text class="ax" x="${X(v)}" y="${H-mb+18}" text-anchor="middle">${fmtK(v)}</text>`;
 if(lo<0&&hi>0)g+=`<line class="zero" x1="${X(0)}" x2="${X(0)}" y1="${mt}" y2="${H-mb}"/>`;
 g+=`<text class="ax" x="${(W+ml)/2}" y="${H-6}" text-anchor="middle">Savings at the end of year 5</text>`;
 pts.forEach(p=>{g+=`<circle class="pt ${p.k}" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4"><title>${esc(PATHS[p.o].name)} in ${esc(cityById(p.c).name)} first · Joy ${Math.round(p.y)} · ${fmtK(p.x)}</title></circle>`});
 return `<div class="map scatter">${g}</svg></div>`;
}
function vResults(){
 const sim=lastSim,s=state,pr=s.profile,a=sim.all,age=STAGES[pr.stage].age+4;
 const tiles=[[`${a.happy}%`,'ended happy (Joy 70 or more)'],[fmtK(a.cash),`median savings at age ${age}`],[`${a.burn}%`,'burned out at least once'],[`${Math.round(a.clar)}`,'average Clarity, out of 100']];
 const maxJoy=100;
 const rows=sim.byOpen.map((g,i)=>{const p=PATHS[g.k];return `<tr class="${i<3?'lead':''}"><td><span class="dot ${p.kind}"></span>${p.name}</td><td class="num">${g.n}</td><td class="barcell"><span class="hbar"><i class="${p.kind}" style="width:${g.joy/maxJoy*100}%"></i></span><span class="mono">${Math.round(g.joy)}</span></td><td class="num">${fmtK(g.cash)}</td><td class="num">${g.burn}%</td><td class="num">${Math.round(g.clar)}</td><td><button class="linkbtn" data-act="playOpen" data-id="${g.k}">Play</button></td></tr>`}).join('');
 const cities=sim.byCity.map(g=>{const c=cityById(g.k);return `<tr><td><span class="mono">${c.id}</span> ${c.name}</td><td class="num">${g.n}</td><td class="barcell"><span class="hbar"><i class="neutral" style="width:${g.joy}%"></i></span><span class="mono">${Math.round(g.joy)}</span></td><td class="num">${fmtK(g.cash)}</td><td class="num">${g.burn}%</td></tr>`}).join('');
 const reps=sim.reps.map(r=>({name:r.label,sub:`Joy ${Math.round(r.l.f.joy)} · ${fmtK(r.l.f.cash)}`,stops:r.l.stops}));
 const repBtns=sim.reps.map(r=>`<button class="btn ghost" data-act="playOpen" data-id="${r.l.open}" data-city="${r.l.openCity}">Play the ${r.label.toLowerCase().replace(' life','')} start: ${PATHS[r.l.open].name} in ${cityById(r.l.openCity).name}</button>`).join('');
 return `<header class="top"><div class="brand"><span class="bullet">5Y</span>Five Year Run</div><button class="linkbtn" data-act="toSetup">Change my answers</button></header>
 <section class="verdict"><p class="kicker">${esc(pr.name)} · ${STAGES[pr.stage].label.toLowerCase()} · ${FIELDS[pr.field]} · values ${pr.values.map(v=>VALUES[v]).join(' + ')}</p>
  <h2 class="found">We ran 1,000 versions of your next five years. <span>Here's what we found.</span></h2>
  <p class="lede">Every simulated ${esc(pr.name)} started from where you are now, picked a random first move and city, and made choices leaning toward ${pr.values.map(v=>VALUES[v]).join(' and ')}, the way you said you would.</p></section>
 <section class="tiles">${tiles.map(t=>`<div><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</section>
 ${vTake()}
 <section class="findings">${sim.F.map(f=>`<div class="panel"><h3>${esc(f.h)}</h3><p>${esc(f.p)}</p></div>`).join('')}</section>
 <section class="panel"><h3 class="h-sm">All 1,000 lives, plotted</h3><p class="muted">Each dot is one life: how much Joy it ended with and how much money it saved. Color shows the first move. Hover a dot for details.</p>
  <div class="legend"><span><i style="background:var(--job)"></i>Started with a job (${sim.byKind.job?.n||0})</span><span><i style="background:var(--gap)"></i>Gap year (${sim.byKind.gap?.n||0})</span><span><i style="background:var(--study)"></i>Master's (${sim.byKind.study?.n||0})</span></div>
  <div class="ylab mono">Joy</div>${scatterSVG(sim)}</section>
 <section class="panel"><h3 class="h-sm">Every first move, ranked by how happy it made you</h3><p class="muted">Average across the lives that started with each move. The top three are highlighted. Savings are medians.</p>
  <div class="table-wrap"><table class="rank"><thead><tr><th>First move</th><th class="num">Lives</th><th>Avg Joy</th><th class="num">Savings</th><th class="num">Burnout</th><th class="num">Clarity</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>
 <section class="panel"><h3 class="h-sm">Where you started</h3>
  <div class="table-wrap"><table class="rank"><thead><tr><th>First city</th><th class="num">Lives</th><th>Avg Joy</th><th class="num">Savings</th><th class="num">Burnout</th></tr></thead><tbody>${cities}</tbody></table></div></section>
 <section class="panel"><h3 class="h-sm">Three lives worth trying for yourself</h3><p class="muted">Start where these lives started. Your version will play out differently, and that's the point: it shows you how you react when it's actually you deciding.</p>
  ${routeSVG(reps)}${legend}<div class="stackbtns">${repBtns}</div></section>
 <div class="row"><button class="btn go" data-act="playOwn">Pick my own first move</button><button class="btn ghost" data-act="rerun">Run 1,000 more</button></div>`;
}

function render(){
 const v={title:vTitle,setup:vSetup,simming:vSimming,results:vResults,path:vPath,city:vCity,apply:vApply,event:vEvent,yearEnd:vYearEnd,cross:vCross,ending:vEnding}[state.screen]||vTitle;
 app.innerHTML=v()+(AI.panel?vAiPanel():'');
}
app.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el.dataset)}});
app.addEventListener('input',e=>{
 const id=e.target.id;
 if(id==='nm'&&state.draft)state.draft.name=e.target.value;
 const k={aibase:'base',aimodel:'model',aikey:'key'}[id];
 if(k){AI.cfg[k]=e.target.value.trim();AI.test=null;saveAiCfg();const b=document.querySelector('[data-act=aiTest]'),t=document.getElementById('aitest');if(b)b.disabled=!aiReady();if(t)t.textContent=aiReady()?'':'Fill in the fields above to turn AI on.'}
});
app.addEventListener('change',e=>{if(e.target.id==='aipreset'){const p=presetOf(e.target.value);Object.assign(AI.cfg,{preset:p.id,base:p.base,model:p.model});AI.test=null;saveAiCfg();render();document.getElementById('aipreset')?.focus()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&AI.panel){AI.panel=false;render()}});

window.claude?.hot?.snapshot?.(()=>({state,lastSim}));
function start(data){
 state=(data&&data.state)?data.state:{screen:'title'};
 if(data&&data.lastSim)lastSim=data.lastSim;
 if(state.screen==='simming')state={screen:lastSim?'results':'title',profile:state.profile};
 if(state.screen==='results'&&!lastSim)state={screen:'title',profile:state.profile};
 if(state.aiBusy){state.aiBusy=false;if(!state.aiEv)state.aiErr='The page reloaded while the AI was writing. Try again, or use a classic event.'}
 if(state.take?.busy){state.take.busy=false;state.take.err='The page reloaded while the AI was writing. Try again.'}
 if(state.story?.busy){state.story.busy=false;state.story.err='The page reloaded while the AI was writing. Try again.'}
 render();
 const refresh=()=>{if(['setup','title','ending','results'].includes(state.screen)||AI.panel)render()};
 window.claude?.use?.('sample').then(f=>{AI.host=f||null;refresh()}).catch(()=>{});
 if(!AI.inArtifact&&/^https?:$/.test(location.protocol))fetch('/api/ai').then(r=>r.ok?r.json():null).then(j=>{if(j?.enabled){AI.server={label:j.label||''};refresh()}}).catch(()=>{});
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
